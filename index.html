<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" id="fav"><title>VOID FEUD — Official Tournament Control</title>
<style>
:root{--bg:#0b0b0c;--p:#151517;--p2:#1e1e21;--p3:#29292d;--or:#ff9d0a;--or2:#ff6a00;--hi:#ffd476;--wh:#f6f3ee;--mu:#9d978d;--gr:#3ddc97;--fs:16px;--g:linear-gradient(180deg,#ffc247,#ff8a00);--r:18px}
*{box-sizing:border-box;margin:0}html{font-size:var(--fs)}
body{background:radial-gradient(900px 420px at 50% -8%,#3a2306 0,transparent 65%),var(--bg);color:var(--wh);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body.pres{--fs:19px}.pres .mgmt{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.h{font-weight:800}
.top{background:#0d0d0ee6;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);box-shadow:0 8px 30px #0008}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}.brand img{height:46px;width:auto;display:block}
.brand span{font-size:.62rem;letter-spacing:.2em;color:var(--mu);font-weight:700}
.btn{background:var(--p3);color:var(--wh);border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:.74rem;font-family:inherit;letter-spacing:.08em;cursor:pointer;text-transform:uppercase;transition:.15s}
.btn:hover{background:#3a3a40;transform:translateY(-1px)}
.btn.pr{background:var(--g);color:#2a1300;box-shadow:0 6px 18px #ff8a0040}.btn.pr:hover{background:linear-gradient(180deg,#ffd067,#ff9a1a)}
.btn.dg:hover{background:#4a1d1f;color:#ff8a8a}
.pill{background:#ff9d0a22;color:var(--hi);padding:9px 15px;border-radius:999px;font-size:.7rem;letter-spacing:.14em;font-weight:800}
.hero{margin:22px 0 0;padding:34px 22px 26px;border-radius:28px;text-align:center;background:linear-gradient(180deg,#201508,var(--p) 70%)}
.herologo{display:block;margin:0 auto;width:min(520px,86%);height:auto;filter:drop-shadow(0 10px 40px #ff8a0055)}
.hero h1{font-size:clamp(2.2rem,8vw,5rem);line-height:1}.hero h1 em{font-style:normal;color:var(--or)}
.hero .st{display:inline-block;margin:6px 0 10px;font-size:.74rem;letter-spacing:.24em;color:var(--hi);font-weight:800}
.hero p{max-width:600px;color:#c4beb4;margin:10px auto 24px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stats div{padding:18px 12px;border-radius:var(--r);background:var(--p2)}
.stats b{display:block;font-size:clamp(1.5rem,4vw,2.2rem);color:var(--or);overflow-wrap:anywhere}.stats span{font-size:.66rem;letter-spacing:.16em;color:var(--mu);font-weight:700}
.hero.ch{background:linear-gradient(180deg,#4a2b07,var(--p) 80%)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.flow div{flex:1 1 105px;text-align:center;padding:11px 6px;font-size:.62rem;letter-spacing:.1em;color:#77726a;background:var(--p);border-radius:999px;font-weight:800}
.flow div.on{background:var(--g);color:#2a1300}.flow div.dn{color:var(--wh);background:var(--p3)}
.sec{margin:34px 0}.sec>h2{font-size:1.25rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}.sec>h2:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tm{display:flex;align-items:center;gap:8px;background:var(--p);padding:8px 14px;border-radius:999px}.tm i{font-style:normal;color:var(--or);font-weight:800;font-size:.8rem}
.tm input{background:transparent;border:0;color:var(--wh);font:inherit;width:100%;padding:6px 2px;outline:0}.tm:focus-within{background:var(--p3)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:18px}
.gc{--ac:var(--or);background:var(--p);border-radius:26px;padding:22px;box-shadow:0 14px 40px #0006}.gc.b{--ac:var(--wh)}
.gc header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gc h3{font-size:1.7rem;color:var(--ac)}.gs{font-size:.64rem;letter-spacing:.14em;color:var(--mu);font-weight:800;background:var(--p2);padding:7px 12px;border-radius:999px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:.92rem;margin-bottom:12px}th{font-size:.6rem;letter-spacing:.12em;color:var(--mu);text-align:center;padding:4px}
td{padding:12px 6px;text-align:center;background:var(--p2)}td:first-child{border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}
th:nth-child(2),td:nth-child(2){text-align:start}td:nth-child(2){font-weight:700;overflow-wrap:anywhere}
tr.q td{background:#3ddc9722}tr.q td:first-child,tr.q td:nth-child(2){color:var(--gr);font-weight:800}
tr.t td{background:#ff9d0a22}tr.t td:first-child{color:var(--or);font-weight:800}
.tag{font-size:.54rem;letter-spacing:.1em;background:#ffffff1a;padding:3px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.mt{background:var(--p2);border-radius:20px;margin-bottom:10px;padding:8px}.mh{display:flex;justify-content:space-between;gap:8px;padding:6px 10px 8px;font-size:.6rem;letter-spacing:.12em;color:var(--mu);font-weight:800}
.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:6px}.vs{display:grid;place-items:center;padding:0 4px;color:var(--or);font-weight:900;font-size:.8rem}
.wb{background:var(--p3);color:var(--wh);border:0;border-radius:14px;padding:16px 10px;font-weight:800;font-size:1rem;font-family:inherit;cursor:pointer;text-align:center;overflow-wrap:anywhere;transition:.15s}
.wb small{display:block;font-size:.58rem;letter-spacing:.12em;color:var(--mu);margin-top:4px}.wb:hover:not(:disabled){background:#3a3a40;color:var(--hi)}.wb:disabled{color:#5d5a55;cursor:default}
.wb.win{background:var(--g);color:#2a1300;box-shadow:0 6px 20px #ff8a0040}.wb.win small{color:#4a2600}.wb.lose{opacity:.35;text-decoration:line-through}
.tb{background:#ff9d0a1a;border-radius:20px;padding:16px;margin-top:8px}.tb h4{color:var(--hi);font-size:1.05rem;margin-bottom:6px}.tb p{font-size:.84rem;color:#ddd6ca;line-height:1.55;margin-bottom:10px}
.bk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;align-items:center;background:var(--p);border-radius:26px;padding:24px}.bk h5{font-size:.74rem;letter-spacing:.24em;color:var(--mu);margin-bottom:10px;text-align:center}
.bk .col{position:relative}.bk .col:not(:last-child):after{content:"";position:absolute;right:-34px;top:50%;width:34px;height:3px;border-radius:3px;background:var(--g)}
.bk .mb{grid-template-columns:1fr}.bk .vs{padding:2px}.bk .wb{padding:14px}
.champ{border-radius:24px;background:radial-gradient(circle at 50% 0,#ff9d0a44,#1a1208);padding:34px 14px;text-align:center}
.champ b{display:block;font-size:clamp(1.6rem,4vw,2.6rem);color:var(--hi);overflow-wrap:anywhere}.champ span{font-size:.7rem;letter-spacing:.2em;color:var(--mu)}
footer{padding:30px 0 50px;color:#5d5a55;font-size:.7rem;letter-spacing:.18em;text-align:center}
@media(max-width:820px){.bk{grid-template-columns:1fr;gap:22px}.bk .col:not(:last-child):after{display:none}.brand{width:100%}}
@media(max-width:480px){.mb{grid-template-columns:1fr}.vs{padding:2px}}
html[lang=ar] body{font-family:"Segoe UI","Noto Sans Arabic","Noto Kufi Arabic","Geeza Pro",Tahoma,Arial,sans-serif;line-height:1.5}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] .bk .col:not(:last-child):after{right:auto;left:-34px}
[dir=rtl] td:first-child{border-radius:0 14px 14px 0}[dir=rtl] td:last-child{border-radius:14px 0 0 14px}
</style></head><body>
<noscript><p style="padding:20px">VOID FEUD requires JavaScript.</p></noscript>
<header class="top"><div class="wrap">
<div class="brand"><img class="lg" alt="VOID FEUD"><span data-i="sub"></span></div>
<span class="pill" id="phase"></span>
<button class="btn pr mgmt" data-act="draw" data-i="draw"></button>
<button class="btn" data-act="lang" id="langBtn"></button>
<button class="btn" data-act="pres" id="presBtn">Presentation Mode</button>
<button class="btn dg mgmt" data-act="reset" data-i="reset"></button>
</div></header>
<div class="wrap">
<section class="hero" id="hero"></section>
<div class="flow" id="flow"></div>
<section class="sec"><h2 class="h" data-i="hGroups"></h2><div class="groups" id="groups"></div></section>
<section class="sec"><h2 class="h" data-i="hBr"></h2><div id="bracket"></div></section>
<section class="sec mgmt"><h2 class="h" data-i="hTeams"></h2><div class="teams" id="teams"></div></section>
<footer data-i="foot"></footer>
</div>

    var m2={id:g+"T2",a:null,b:null,label:"l2",note:"n2"};
    if(m1.w){m2.a=r[0];m2.b=m1.w===m1.a?m1.b:m1.a;m2.w=wo(T[m2.id],m2.a,m2.b);}
    o.tb={type:3,ms:[m1,m2]};o.tied=r.slice();if(m1.w&&m2.w)o.q=[m1.w,m2.w];
  }else if(w[1]===w[2]){
    var t1={id:g+"T1",a:r[1],b:r[2],label:"l3",note:"n3"};t1.w=wo(T[t1.id],t1.a,t1.b);
    o.tb={type:2,ms:[t1]};o.tied=[r[1],r[2]];if(t1.w)o.q=[r[0],t1.w];
  }else o.q=[r[0],r[1]];
  return o;
}
function bracket(){
  var A=analyze("A"),B=analyze("B"),ok=!!(A.q&&B.q);
  var s1={id:"SF1",a:ok?A.q[0]:null,b:ok?B.q[1]:null},s2={id:"SF2",a:ok?B.q[0]:null,b:ok?A.q[1]:null};
  [s1,s2].forEach(function(s){s.w=(s.a&&s.b)?wo(S.sf[s.id],s.a,s.b):null;});
  var f={id:"FIN",a:s1.w,b:s2.w,w:null};if(f.a&&f.b)f.w=wo(S.fin,f.a,f.b);
  return {A:A,B:B,ok:ok,sf:[s1,s2],fin:f,champ:f.w};
}
function prune(){
  if(!S.groups){S.res={};S.tb={A:{},B:{}};S.sf={};S.fin=null;return;}
  var nr={};["A","B"].forEach(function(g){gm(g).forEach(function(m){var w=wo(S.res[m.id],m.a,m.b);if(w)nr[m.id]=w;});});S.res=nr;
  ["A","B"].forEach(function(g){var a=analyze(g),t={};if(a.tb)a.tb.ms.forEach(function(m){if(m.w)t[m.id]=m.w;});S.tb[g]=t;});
  var b=bracket(),sf={};b.sf.forEach(function(s){if(s.w)sf[s.id]=s.w;});S.sf=sf;S.fin=b.fin.w||null;
}
function phaseIdx(){
  if(!S.groups)return 0;var b=bracket();
  if(b.champ)return 7;if(b.fin.a&&b.fin.b)return 6;if(b.ok)return 5;
  if((b.A.tb&&!b.A.q)||(b.B.tb&&!b.B.q))return 3;return 2;
}
function matchHTML(kind,m,label,note){
  function btn(x){
    if(!x)return '<button class="wb" disabled>'+t("tbd")+'<small>'+t("aw")+'</small></button>';
    var c=m.w?(m.w===x?" win":" lose"):"";
    return '<button class="wb'+c+'" data-act="win" data-k="'+kind+'" data-m="'+m.id+'" data-w="'+x+'">'+esc(nm(x))+'<small>'+(m.w===x?t("winu"):t("win"))+'</small></button>';
  }
  return '<div class="mt"><div class="mh"><span>'+label+'</span><span>'+(note||"")+'</span></div><div class="mb">'+btn(m.a)+'<div class="vs">VS</div>'+btn(m.b)+'</div></div>';
}
function renderHeader(){
  var i=S.groups?phaseIdx():0,d=document.documentElement;
  d.lang=S.lang;d.dir=S.lang==="ar"?"rtl":"ltr";
  $("#phase").textContent=t("p"+i);
  $("#presBtn").textContent=S.pres?t("presx"):t("pres");
  $("#langBtn").textContent=t("lang");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(el){el.textContent=t(el.getAttribute("data-i"));});
  document.body.classList.toggle("pres",S.pres);
}
function renderHero(){
  var h=$("#hero"),b=S.groups?bracket():null,i=phaseIdx();
  var gdone=S.groups?analyze("A").done+analyze("B").done:0;
  var qc=b?((b.A.q?2:0)+(b.B.q?2:0)):0;
  var win=!!(b&&b.champ),champ=win?nm(b.champ):"—";
  h.className="hero"+(win?" ch":"");
  h.innerHTML='<span class="st">'+(win?t("done"):t("status")+" · "+t("p"+i))+'</span>'+
   (win?'<h1 class="h">🏆 <em>'+esc(champ)+'</em></h1>':'<img class="herologo" alt="VOID FEUD" src="'+LOGO+'">')+
   '<p>'+(win?t("descDone"):t("desc"))+'</p>'+
   '<div class="stats"><div><b class="h">6</b><span>'+t("teams")+'</span></div><div><b class="h">'+gdone+'/6</b><span>'+t("gm")+'</span></div><div><b class="h">'+qc+'/4</b><span>'+t("sfs")+'</span></div><div><b class="h">'+esc(champ)+'</b><span>'+t("champ")+'</span></div></div>';
}
function renderFlow(){
  var st=t("flow");
  var i=S.groups?phaseIdx():0,h="";
  var map=[0,1,2,3,4,5,6,7];
  st.forEach(function(t,k){var cur=!S.groups?(k===0):(k===1?false:(k===i||(k===2&&i===2)));if(S.groups&&k===3&&i!==3)cur=false;if(S.groups&&k===i)cur=true;
    var dn=S.groups?(k<i&&!(k===3&&i!==3&&false)):false;h+='<div class="'+(cur?"on":(dn?"dn":""))+'">'+t+'</div>';});
  $("#flow").innerHTML=h;
}
function renderTeams(){
  $("#teams").innerHTML=IDS.map(function(i){return '<label class="tm"><i>#'+i+'</i><input data-id="'+i+'" maxlength="24" value="'+esc(nm(i))+'" aria-label="Team '+i+' name"></label>';}).join("");
}
function renderGroups(){
  var el=$("#groups");
  if(!S.groups){el.innerHTML='<div class="gc" style="grid-column:1/-1;text-align:center;padding:40px"><h3 class="h">'+t("awT")+'</h3><p style="color:var(--mu);margin:10px 0 20px">'+t("awP")+'</p><button class="btn pr mgmt" data-act="draw">'+t("draw")+'</button></div>';return;}
  el.innerHTML=["A","B"].map(function(g){
    var a=analyze(g),stt=!a.complete?t("gstage")+" · "+a.done+"/3 "+t("played"):(a.tb?(a.q?t("tbres"):t("tbreq")):t("qual")),th=t("th");
    var rows=a.rows.map(function(r,k){
      var q=a.q&&a.q.indexOf(r.id)>-1,tt=a.tb&&!a.q&&a.tied.indexOf(r.id)>-1;
      var tag=q?'<span class="tag">'+t("qual")+'</span>':(tt?'<span class="tag" style="color:var(--hi)">'+t("tied")+'</span>':"");
      return '<tr class="'+(q?"q":(tt?"t":""))+'"><td>'+(k+1)+'</td><td>'+esc(nm(r.id))+tag+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.l+'</td></tr>';}).join("");
    var h='<div class="gc'+(g==="B"?" b":"")+'"><header><h3 class="h">'+t("group")+' '+g+'</h3><span class="gs">'+stt+'</span></header>'+
      '<table><thead><tr><th>'+th.join('</th><th>')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
    a.ms.forEach(function(m,k){h+=matchHTML("g",m,t("match")+" "+g+(k+1),t("group")+" "+g);});
    if(a.tb){
      h+='<div class="tb"><h4 class="h">'+t("tbT")+'</h4><p>'+(a.tb.type===3?t("tb3"):t("tb2"))+'</p>';
      a.tb.ms.forEach(function(m){h+=matchHTML("tb",m,t(m.label),t(m.note));});
      h+='</div>';
    }
    return h+'</div>';
  }).join("");
}
function renderBracket(){
  var el=$("#bracket");
  if(!S.groups){el.innerHTML='<p style="color:var(--mu)">'+t("bkEmpty")+'</p>';return;}
  var b=bracket();
  el.innerHTML='<div class="bk"><div class="col"><h5 class="h">'+t("sf")+'</h5>'+matchHTML("sf",b.sf[0],t("sf1"),t("sf1n"))+matchHTML("sf",b.sf[1],t("sf2"),t("sf2n"))+'</div>'+
   '<div class="col"><h5 class="h">'+t("fin")+'</h5>'+matchHTML("fin",b.fin,t("gf"),"")+'</div>'+
   '<div class="col"><h5 class="h">'+t("chm")+'</h5><div class="champ">'+(b.champ?'<span>'+t("cl")+'</span><b class="h">'+esc(nm(b.champ))+'</b>':'<span>'+t("tbd2")+'</span><b class="h">—</b>')+'</div></div></div>';
}
function renderMain(){renderHeader();renderHero();renderFlow();renderGroups();renderBracket();}
function renderAll(){try{renderMain();renderTeams();}catch(e){document.body.insertAdjacentHTML("afterbegin",'<pre style="color:#f66;padding:12px">Render error: '+esc(e.message)+'</pre>');}}
function commit(){prune();save();renderAll();}
function draw(){
  var a=IDS.slice(),i,j,t;
  for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
  S.groups={A:a.slice(0,3),B:a.slice(3)};S.res={};S.tb={A:{},B:{}};S.sf={};S.fin=null;commit();
}
function setWin(k,id,w){
  var box=k==="g"?S.res:(k==="tb"?S.tb[id.charAt(0)]:(k==="sf"?S.sf:null));
  if(k==="fin"){S.fin=(S.fin===w)?null:w;}
  else if(box){if(box[id]===w)delete box[id];else box[id]=w;}
  commit();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||t.disabled)return;var a=t.getAttribute("data-act");
  if(a==="draw"){if(S.groups&&!confirm(t("cDraw")))return;draw();}
  else if(a==="lang"){S.lang=S.lang==="ar"?"en":"ar";save();renderAll();}
  else if(a==="pres"){S.pres=!S.pres;save();renderAll();}
  else if(a==="reset"){if(confirm(t("cReset"))){S.groups=null;S.res={};S.tb={A:{},B:{}};S.sf={};S.fin=null;commit();}}
  else if(a==="win"){setWin(t.getAttribute("data-k"),t.getAttribute("data-m"),Number(t.getAttribute("data-w")));}
});
document.addEventListener("input",function(e){
  var t=e.target;if(t.matches&&t.matches("input[data-id]")){S.names[t.getAttribute("data-id")]=t.value;save();try{renderMain();}catch(x){}}
});
document.getElementById("fav").href=FAV;Array.prototype.forEach.call(document.querySelectorAll(".lg"),function(i){i.src=LOGO;});
load();prune();save();renderAll();
})();
</script></body></html>
